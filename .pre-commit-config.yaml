# Pre-commit configuration for THIS repository (the framework's own repository).
#
# The `stages:` field on each hook decides WHEN it runs, and the tracked git hooks in
# `.githooks/` run whole STAGES rather than named ids — so this file is the single source of
# truth for the commit/push split this repository ships in
# `templates/pre-commit-config.yaml.template`:
#
#   pre-commit  ruff, ruff-format, detect-secrets, detect-private-key, bandit, memory-reconcile (< 2 s)
#   pre-push    mypy over src/ (pyproject.toml carries the recorded baseline)
#   manual      pytest (the hook suite, the shipped payload tests, this repository's own tests)
#
# Do not remove the `stages:` keys. Without them pre-commit defaults a hook to the
# pre-commit stage, which is exactly how a slow hook ends up running on every commit.
#
# WHY pytest IS `stages: [manual]`
#   Tests are never a commit gate: CI (.github/workflows/ci.yml, through scripts/run_checks.py)
#   owns the suite. `python scripts/run_tests.py <paths>` runs the affected tests while you work;
#   `.githooks/pre-push` runs the suite at push time only while CI-OUTAGE MODE is declared
#   (`python scripts/ci_outage_mode.py declare`).
#
# Python in this repository lives under `src/` (the shipped hook runtime and payload), `test/`
# and `scripts/`; ruff reads the root `ruff.toml`, and `src/hooks/ruff.toml` for the hooks. The
# installed toolchain copy under `.claude/` is excluded: it is checked through its source under
# `src/` and by test/test_toolchain_integrity.py. Prompt/documentation files are untouched.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]
        stages: [pre-commit]
        exclude: ^(venv/|tmp/|templates/|old/|workspace/|src/_version\.py|\.claude/)
      - id: ruff-format
        stages: [pre-commit]
        exclude: ^(venv/|tmp/|templates/|old/|workspace/|src/_version\.py|\.claude/)

  # A pushed credential cannot be un-pushed, so secret detection is the one check that has
  # to be earlier than CI. This repository is full of prompt text describing tokens and
  # credential files, so the baseline is doing real work here: generate it with
  #   detect-secrets scan > .secrets.baseline
  # and re-run that after auditing a legitimate finding.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        stages: [pre-commit]
        exclude: ^(venv/|tmp/|\.secrets\.baseline$)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
        stages: [pre-commit]

  # Scoped to the shipped Python under src/. The suites are test code (assert is their job).
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: [-ll]
        stages: [pre-commit]
        files: ^src/
        exclude: ^(src/hooks/tests/|src/payload/test/)

  # Whole-project type analysis at the push boundary (the template's hook). Scope = CI's `mypy src`
  # (scripts/run_checks.py); pyproject.toml carries the recorded baseline.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        stages: [pre-push]
        files: ^src/
        exclude: ^(test/|old/|workspace/|tmp/|venv/|scripts/)
        additional_dependencies: [types-requests, types-python-dateutil]

  - repo: local
    hooks:
      # On demand only — CI owns the suite. scripts/run_tests.py runs every suite in one
      # invocation from the repository root.
      - id: memory-reconcile
        name: memory-reconcile (ledger and lessons under their caps)
        entry: python scripts/memory_compile.py reconcile --apply
        language: system
        pass_filenames: false
        files: ^docs/(findings-ledger|lessons-learned)\.md$
        stages: [pre-commit]
      - id: pytest
        name: pytest (manual — never a commit gate; runs every suite)
        entry: python scripts/run_tests.py
        language: system
        stages: [manual]
        pass_filenames: false
        always_run: true
