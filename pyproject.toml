[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "software-factory-framework"
dynamic = ["version"]
description = "Prompts, agents, hooks and scripts that set up and update AI-assisted software projects for Claude Code and Kiro."
authors = [{ name = "Markus Bestehorn" }]
license = { file = "LICENSE" }
readme = "README.md"
# Everything the framework ships into projects stays standard-library Python 3.9+.
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",     # scripts/run_tests.py's bounded -n; without it runs go sequential
    "hypothesis",
    "ruff",
    "mypy",
    "bandit[toml]",
    "detect-secrets",   # backs the pre-commit secret scan
    "pre-commit",
]

# Nothing here is imported as an installed package: the shipped Python is COPIED into projects (src/hooks/,
# src/payload/), and this repository's own tools run from scripts/. The install exists for the dev extra.
[tool.setuptools]
packages = []

# The version comes from the release tags (vYYYY.MM.DD[.N]; docs/reports/self-hosting-proposal-2026-11-07.md).
[tool.setuptools_scm]
version_file = "src/_version.py"

# Ruff reads the root ruff.toml (it takes precedence over [tool.ruff]), which extends src/hooks/ruff.toml.

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = ["src/_version.py", "venv", ".venv"]

[tool.pytest.ini_options]
# The product suites (the hook runtime's own, the shipped payload tests) and this repository's own tests (the
# layout guard, the toolchain integrity check, the installed corpus-budget guard).
testpaths = ["src/hooks/tests", "src/payload/test", "test"]
# importlib: test/ and src/payload/test/ both hold a test_instruction_corpus_budget.py (the installed copy
# checks this repository; the product copy is what ships). NO coverage flags here — scripts/run_tests.py adds
# them under --coverage.
addopts = "-ra --import-mode=importlib"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.bandit]
exclude_dirs = ["test", "src/hooks/tests", "src/payload/test", "venv", ".venv"]
skips = ["B101"]
